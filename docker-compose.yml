services:
  postgres:
    image: postgres:16-alpine
    container_name: expense-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - expense-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: expense-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FLASK_ENV: development
      LOG_LEVEL: DEBUG
    command: >
      sh -c "python -c \"from app import create_app, db; app = create_app('development'); ctx = app.app_context(); ctx.push(); db.create_all(); from app.models.category import Category; from app.seed_data import seed_database; seed_database() if Category.query.count() == 0 else print('DB already initialized')\" && gunicorn --bind 0.0.0.0:5000 --workers 4 --threads 2 --timeout 120 --access-logfile - --error-logfile - run:app"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health/live')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      expense-network:
        aliases:
          - backend-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expense-frontend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 5000
      LOG_LEVEL: DEBUG
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - expense-network

  loki:
    image: grafana/loki:2.9.8
    container_name: expense-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
    networks:
      - expense-network

  promtail:
    image: grafana/promtail:2.9.8
    container_name: expense-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - expense-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: expense-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    networks:
      - expense-network

networks:
  expense-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
