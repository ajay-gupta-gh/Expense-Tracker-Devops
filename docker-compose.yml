version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: expense-postgres
    environment:
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: expense_pass
      POSTGRES_DB: expense_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_user -d expense_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - expense-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: expense-backend
    environment:
      DATABASE_URL: postgresql://expense_user:expense_pass@postgres:5432/expense_tracker
      FLASK_ENV: development
      LOG_LEVEL: DEBUG
    command: >
      sh -c "python -c \"from app import create_app, db; app = create_app('development'); ctx = app.app_context(); ctx.push(); db.create_all(); from app.models.category import Category; from app.seed_data import seed_database; seed_database() if Category.query.count() == 0 else print('DB already initialized')\" && gunicorn --bind 0.0.0.0:5000 --workers 4 --threads 2 --timeout 120 --access-logfile - --error-logfile - run:app"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      expense-network:
        aliases:
          - backend-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expense-frontend
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
      LOG_LEVEL: DEBUG
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - expense-network

networks:
  expense-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
