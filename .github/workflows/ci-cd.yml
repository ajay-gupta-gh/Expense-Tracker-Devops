name: Expense Tracker CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Backend Tests
        env:
          DATABASE_URL: 'sqlite:///:memory:'
        run: |
          pytest tests/ -v

  backend:
    needs: test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: |
          docker build -t ajguptadocker/expensetracker-backend:v1 .

      - name: Push Backend Image
        run: |
          docker push ajguptadocker/expensetracker-backend:v1

  frontend:
    needs: backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend Image
        run: |
          docker build -t ajguptadocker/expensetracker-frontend:v1 .

      - name: Push Frontend Image
        run: |
          docker push ajguptadocker/expensetracker-frontend:v1

  deploy:
    needs: frontend

    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Kind Cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy to Kind
        run: |
          kubectl delete deployment postgres -n expense-tracker --ignore-not-found
          kubectl apply -k kubernetes/

      - name: Restart Backend Deployment
        run: |
          kubectl rollout restart deployment expense-tracker-backend -n expense-tracker
          kubectl rollout status deployment/expense-tracker-backend -n expense-tracker

      - name: Restart Frontend Deployment
        run: |
          kubectl rollout restart deployment expense-tracker-frontend -n expense-tracker
          kubectl rollout status deployment/expense-tracker-frontend -n expense-tracker

      # - name: Wait for Backend Rollout
      #   run: |
      #     kubectl rollout status deployment/expense-tracker-backend -n expense-tracker

      # - name: Wait for Frontend Rollout
      #   run: |
      #     kubectl rollout status deployment frontend

      - name: Verify Resources
        run: |
          kubectl get pods
          kubectl get svc