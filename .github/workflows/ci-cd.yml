name: Expense Tracker CI/CD

on:
  push:
    branches:
      - main
jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: |
          docker build -t ajguptadocker/expensetracker-backend:latest .

      - name: Push Backend Image
        run: |
          docker push ajguptadocker/expensetracker-backend:latest

  frontend:
    needs: backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend Image
        run: |
          docker build -t ajguptadocker/expensetracker-frontend:latest .

      - name: Push Frontend Image
        run: |
          docker push ajguptadocker/expensetracker-frontend:latest

  deploy:
    needs:
      - backend
      - frontend

    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Kind Cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy to Kind
        run: |
          kubectl delete deployment postgres -n expense-tracker --ignore-not-found
          kubectl apply -k kubernetes/

      - name: Restart Backend Deployment
        run: |
          kubectl rollout restart deployment backend

      - name: Restart Frontend Deployment
        run: |
          kubectl rollout restart deployment frontend

      - name: Wait for Backend Rollout
        run: |
          kubectl rollout status deployment backend

      - name: Wait for Frontend Rollout
        run: |
          kubectl rollout status deployment frontend



      - name: Verify Resources
        run: |
          kubectl get pods
          kubectl get svc