name: Expense Tracker CI/CD

on:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Tests
        run: |
          pytest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Docker Image
        run: |
          docker build -t ajguptadocker/expensetracker-backend:latest .

      - name: Push Backend Docker Image
        run: |
          docker push ajguptadocker/expensetracker-backend:latest

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      # Uncomment this if you've configured Vitest
      # - name: Run Frontend Tests
      #   run: npm run test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend Docker Image
        run: |
          docker build -t ajguptadocker/expensetracker-frontend:latest .

      - name: Push Frontend Docker Image
        run: |
          docker push ajguptadocker/expensetracker-frontend:latest

  deploy:
    name: Deploy to Kubernetes
    needs:
      - backend
      - frontend

    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Cluster
        run: kubectl get nodes

      - name: Deploy Kubernetes Manifests
        run: |
          kubectl apply -f k8s/

      - name: Restart Backend Deployment
        run: |
          kubectl rollout restart deployment backend

      - name: Restart Frontend Deployment
        run: |
          kubectl rollout restart deployment frontend

      - name: Wait for Backend Rollout
        run: |
          kubectl rollout status deployment backend

      - name: Wait for Frontend Rollout
        run: |
          kubectl rollout status deployment frontend