name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'kubernetes/frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          npm install

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend Image
        run: |
          docker build -t ajguptadocker/expensetracker-frontend:v1 .

      - name: Push Frontend Image
        run: |
          docker push ajguptadocker/expensetracker-frontend:v1

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -k kubernetes/

      - name: Restart Frontend Deployment
        run: |
          kubectl rollout restart deployment expense-tracker-frontend -n expense-tracker
          kubectl rollout status deployment expense-tracker-frontend -n expense-tracker

      - name: Verify Frontend
        run: |
          kubectl get pods -n expense-tracker
          kubectl get svc -n expense-tracker