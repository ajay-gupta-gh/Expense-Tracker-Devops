user nginx;

worker_processes auto;

error_log /dev/stderr info;

pid /var/run/nginx.pid;

events {

    worker_connections 1024;
}

http {

    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    map $status $log_level {

        ~^[45] ERROR;

        default INFO;
    }

    map $http_x_correlation_id $correlation_id {
        ""      $request_id;
        default $http_x_correlation_id;
    }

    log_format json_format escape=json '{
        "timestamp":"$time_iso8601",
        "level":"$log_level",
        "service":"nginx-frontend",
        "message":"$request",
        "correlation_id":"$correlation_id",
        "request_id":"$request_id",
        "status":$status,
        "response_time":$request_time,
        "client_ip":"$remote_addr",
        "user_agent":"$http_user_agent",
        "referer":"$http_referer",
        "request_method":"$request_method",
        "request_uri":"$request_uri",
        "bytes_sent":$bytes_sent,
        "upstream_response_time":"$upstream_response_time",
        "upstream_addr":"$upstream_addr",
        "request_body_size":$request_length
    }';

    access_log /dev/stdout json_format;

    sendfile on;

    keepalive_timeout 65;

    gzip on;

    gzip_vary on;

    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        text/xml
        text/javascript;

    include /etc/nginx/conf.d/*.conf;
}