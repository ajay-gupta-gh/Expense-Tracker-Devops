apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: expense-tracker
  labels:
    app: expense-tracker
    component: db-init
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine  # ✅ Specific version
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres-service -U expense_user -d expense_tracker; do
                echo "Waiting for database..."
                sleep 2
              done
      containers:
        - name: db-init
          # ✅ Use specific version, NOT :latest
          image: ajguptadocker/expensetracker-backend:v1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: expense-tracker-secret
                  key: DATABASE_URL
            - name: FLASK_ENV
              valueFrom:
                configMapKeyRef:
                  name: expense-tracker-config
                  key: FLASK_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: expense-tracker-config
                  key: LOG_LEVEL
          command:
            - /bin/sh
            - -c
            - |
              python -c "
              from app import create_app, db
              app = create_app('production')
              with app.app_context():
                  db.create_all()
                  from app.models.category import Category
                  from app.seed_data import seed_database
                  if Category.query.count() == 0:
                      seed_database()
                      print('✅ Database initialized and seeded')
                  else:
                      print('✅ Database already initialized')
              "
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"