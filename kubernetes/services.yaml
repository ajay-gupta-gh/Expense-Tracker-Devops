---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: expense-tracker
  labels:
    app: expense-tracker
    component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP
  selector:
    app: expense-tracker
    component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: expense-tracker
  labels:
    app: expense-tracker
    component: frontend
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
  selector:
    app: expense-tracker
    component: frontend