apiVersion: apps/v1
kind: Deployment

metadata:
  name: expense-tracker-backend
  namespace: expense-tracker

  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: expense-tracker

spec:
  replicas: 2

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: backend

    spec:
      containers:

        - name: backend

          image: ajguptadocker/expensetracker-backend:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          env:


            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: expense-tracker-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: expense-tracker-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: expense-tracker-secret
                  key: POSTGRES_DB

            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"

            - name: POSTGRES_HOST
              value: postgres

            - name: POSTGRES_PORT
              value: "5432"

            - name: FLASK_ENV
              valueFrom:
                configMapKeyRef:
                  name: expense-tracker-config
                  key: FLASK_ENV

            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: expense-tracker-config
                  key: LOG_LEVEL

          resources:

            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:

            httpGet:
              path: /api/v1/health/live
              port: 5000

            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:

            httpGet:
              path: /api/v1/health/ready
              port: 5000

            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:

            httpGet:
              path: /api/v1/health/live
              port: 5000

            initialDelaySeconds: 30
            periodSeconds: 20