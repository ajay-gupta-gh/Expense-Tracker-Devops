apiVersion: v1
kind: Service

metadata:
  name: backend-service
  namespace: expense-tracker

  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: expense-tracker

spec:
  type: ClusterIP

  selector:
    app: backend

  ports:
    - name: http
      protocol: TCP
      port: 5000
      targetPort: 5000